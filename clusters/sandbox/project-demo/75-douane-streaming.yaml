# Spark Structured Streaming consumer for the real-time customs (douane) demo:
# reads demo-kafka-main's "douane.evenements" topic and writes each event type
# into its own gold.douane.* Iceberg table, continuously (~5s micro-batch).
#
# Not submitted through the platform's spark_submit.py/Airflow path: that
# helper polls for a COMPLETED SparkApplication state, which a streaming job
# never reaches. Applied directly instead, long-running (restartPolicy
# Always, no timeToLiveSeconds) -- same pattern as 70-douane-producer.yaml.
#
# The job source lives at okdp-examples' docker/../airflow/dags/spark_jobs/
# douane_streaming_job.py (feat/douane-producer branch, kept unmerged like the
# producer image -- see that branch's Dockerfile comment). It rides in a
# ConfigMap rather than baked into an image, so re-publish it by hand whenever
# the script changes:
#   kubectl -n demo create configmap douane-streaming-code \
#     --from-file=douane_streaming_job.py=<path-to>/douane_streaming_job.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Requires the same "douane.evenements" topic as the producer (see
# 70-douane-producer.yaml) and the demo project's usual Spark/Polaris/S3
# credentials (creds-examples-s3, creds-polaris-oauth2-etl-okdp-sandbox,
# certs-bundle), already present for the einvoicing/france-establishments jobs.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: douane-streaming
  namespace: demo
  labels:
    okdp.io/project: demo
spec:
  type: Python
  mode: cluster
  image: quay.io/okdp/spark-py:spark-3.5.6-python-3.11-scala-2.12-java-17
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/app/douane_streaming_job.py
  arguments:
    - demo-kafka-main.demo.svc.cluster.local:9092
    - douane.evenements
    - gold
  sparkVersion: "3.5.6"
  # Streaming, not batch: keep the driver running rather than treat any exit
  # as a completed job.
  restartPolicy:
    type: Always
  # deps.packages (Ivy resolution) fails in this cluster: the operator's
  # spark-submit runs with a read-only $HOME, and Ivy needs to write its
  # resolution cache there. deps.jars downloads plain URLs instead, no Ivy.
  deps:
    jars:
      - https://repo1.maven.org/maven2/org/apache/spark/spark-sql-kafka-0-10_2.12/3.5.6/spark-sql-kafka-0-10_2.12-3.5.6.jar
      - https://repo1.maven.org/maven2/org/apache/spark/spark-token-provider-kafka-0-10_2.12/3.5.6/spark-token-provider-kafka-0-10_2.12-3.5.6.jar
      - https://repo1.maven.org/maven2/org/apache/kafka/kafka-clients/3.4.1/kafka-clients-3.4.1.jar
      - https://repo1.maven.org/maven2/org/apache/commons/commons-pool2/2.11.1/commons-pool2-2.11.1.jar
  sparkConf:
    spark.hadoop.fs.s3a.endpoint: http://storage-svc.default.svc.cluster.local:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.fast.upload: "true"
    spark.hadoop.fs.s3a.fast.upload.buffer: bytebuffer
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: s3a://spark-events/event-logs
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.gold: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.gold.type: rest
    spark.sql.catalog.gold.warehouse: gold
    spark.sql.catalog.gold.uri: https://polaris-demo.okdp.sandbox/api/catalog
    spark.sql.catalog.gold.rest.auth.type: oauth2
    spark.sql.catalog.gold.oauth2-server-uri: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/token
    spark.sql.catalog.gold.scope: profile
    spark.sql.catalog.gold.token-refresh-enabled: "true"
    spark.sql.catalog.gold.header.Polaris-Realm: sandbox
    spark.sql.catalog.gold.header.X-Iceberg-Access-Delegation: vended-credentials
    spark.sql.catalog.gold.io-impl: org.apache.iceberg.io.ResolvingFileIO
    spark.sql.catalog.gold.client.region: us-east-1
    spark.sql.catalog.gold.s3.region: us-east-1
  volumes:
    - name: job-script
      configMap:
        name: douane-streaming-code
    - name: cacerts
      secret:
        secretName: certs-bundle
  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark
    labels:
      workload: douane-streaming
    volumeMounts:
      - name: job-script
        mountPath: /opt/spark/app
      - name: cacerts
        mountPath: /cacerts
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID: { name: creds-examples-s3, key: S3_ACCESS_KEY }
      AWS_SECRET_ACCESS_KEY: { name: creds-examples-s3, key: S3_SECRET_KEY }
      POLARIS_CLIENT_ID: { name: creds-polaris-oauth2-etl-okdp-sandbox, key: client_id }
      POLARIS_CLIENT_SECRET: { name: creds-polaris-oauth2-etl-okdp-sandbox, key: client_secret }
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStorePassword="
  executor:
    instances: 1
    cores: 1
    memory: 2g
    labels:
      workload: douane-streaming
    volumeMounts:
      - name: job-script
        mountPath: /opt/spark/app
      - name: cacerts
        mountPath: /cacerts
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID: { name: creds-examples-s3, key: S3_ACCESS_KEY }
      AWS_SECRET_ACCESS_KEY: { name: creds-examples-s3, key: S3_SECRET_KEY }
      POLARIS_CLIENT_ID: { name: creds-polaris-oauth2-etl-okdp-sandbox, key: client_id }
      POLARIS_CLIENT_SECRET: { name: creds-polaris-oauth2-etl-okdp-sandbox, key: client_secret }
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStorePassword="
