# Continuous event generator for the real-time customs (douane) demo. Not a
# KuboCD package (like the einvoicing generator, it is demo scaffolding, not a
# catalog service): a plain Deployment running docker/douane_producer.py from
# the okdp-examples image, publishing simulated events to the demo-kafka-main
# broker (see okdp-packages/packages/services/kafka).
#
# Image pinned to the feat/douane-producer branch build, not :main: that
# branch is intentionally kept unmerged. CI tags a branch push by its name
# with any "feat/"/"fix/"-style prefix stripped, hence ":douane-producer"
# rather than ":feat--douane-producer". Bump this tag by re-pushing the
# branch (force-push after a rebase counts) and updating it here.
#
# Requires the "douane.evenements" topic to already exist on the broker
# (auto-creation is not relied on):
#   kubectl -n demo exec demo-kafka-main-controller-0 -- kafka-topics.sh \
#     --bootstrap-server localhost:9092 --create --topic douane.evenements \
#     --partitions 3 --replication-factor 1 --if-not-exists
apiVersion: apps/v1
kind: Deployment
metadata:
  name: douane-producer
  namespace: demo
  labels:
    okdp.io/project: demo
    app: douane-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: douane-producer
  template:
    metadata:
      labels:
        app: douane-producer
    spec:
      containers:
        - name: producer
          image: ghcr.io/alex-mabrouk/okdp-examples:douane-producer
          command: ["python", "/usr/local/bin/douane-producer"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: demo-kafka-main.demo.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: douane.evenements
            - name: EVENTS_PER_SEC
              value: "2"
            # Tuned for a live demo: a fraud alert every ~5s at this rate, not
            # once an hour like a real customs office.
            - name: FRAUD_RATE
              value: "0.10"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
