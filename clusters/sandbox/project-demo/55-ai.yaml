# Local AI capability of the demo project: an inference server the data pipeline
# calls in-cluster, and a chat interface for exploring the gold tables. No model
# call ever leaves the platform.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: demo-ollama
  namespace: demo
  labels:
    okdp.io/project: demo
    okdp.io/service: ollama
    okdp.io/instance-name: ollama
spec:
  description: Local LLM inference server of the demo project
  package:
    repository: ghcr.io/alex-mabrouk/okdp-packages/ollama
    tag: 1.62.0-p04
    interval: 30m
    timeout: 30m
  parameters:
    model: mistral:7b
    # Weights live in VRAM, so the pod only holds the runtime.
    gpu: 1
    memoryGi: 8
    storageGi: 10
  targetNamespace: demo
---
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: demo-ollama-ui
  namespace: demo
  labels:
    okdp.io/project: demo
    okdp.io/service: ollama-ui
    okdp.io/instance-name: ollama-ui
spec:
  description: Chat interface over the demo project models
  package:
    repository: ghcr.io/alex-mabrouk/okdp-packages/ollama-ui
    tag: 16.1.0-p04
    interval: 30m
    timeout: 15m
  parameters:
    ollamaInstanceName: ollama
    storageGi: 2
  targetNamespace: demo
