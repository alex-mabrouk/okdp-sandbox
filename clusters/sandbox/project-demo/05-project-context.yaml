# Picked up by every Release of this namespace through the Config's
# defaultNamespaceContexts, console-created ones included. It is what makes a
# project service register its own OIDC client instead of reading a Secret
# prepared by hand. A namespace without this Context keeps the platform default.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Context
metadata:
  name: project
  namespace: demo
spec:
  context:
    oidc:
      clientProvisioning: dcr
      dcr:
        registrationUrl: https://keycloak.okdp.sandbox/realms/master/clients-registrations/openid-connect
        authMethod: anonymous
