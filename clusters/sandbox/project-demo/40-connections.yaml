# Connections of the demo project, declared by hand: one per logical database
# (same server, different dbName) plus the platform object store. The Releases
# consume them by name. No password here: the database ones use the Secret CNPG
# generates (or the managed role Secret for airflow), the s3 one the credentials
# shipped by the optional storage component.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Connection
metadata:
  name: demo-db-hive
  namespace: demo
spec:
  contract: database-server
  description: Hive metastore database
  values:
    engine: postgresql
    driver: org.postgresql.Driver
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: hive
    sslMode: disable
    secretRef: demo-pg-app
---
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Connection
metadata:
  name: demo-db-superset
  namespace: demo
spec:
  contract: database-server
  description: Superset metadata database
  values:
    engine: postgresql
    driver: org.postgresql.Driver
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: superset
    sslMode: disable
    secretRef: demo-pg-app
---
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Connection
metadata:
  name: demo-db-superset-examples
  namespace: demo
spec:
  contract: database-server
  description: Superset examples database
  values:
    engine: postgresql
    driver: org.postgresql.Driver
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: superset_examples
    sslMode: disable
    secretRef: demo-pg-app
---
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Connection
metadata:
  name: demo-db-polaris
  namespace: demo
spec:
  contract: database-server
  description: Polaris catalog database
  values:
    engine: postgresql
    driver: org.postgresql.Driver
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: polaris
    sslMode: disable
    secretRef: demo-pg-app
---
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Connection
metadata:
  name: demo-db-airflow
  namespace: demo
spec:
  contract: database-server
  description: Airflow metadata database
  values:
    engine: postgresql
    driver: org.postgresql.Driver
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: airflow
    sslMode: disable
    secretRef: demo-airflow-db-role
---
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Connection
metadata:
  name: demo-storage
  namespace: demo
spec:
  contract: s3
  description: Platform S3 store, shared with this project
  values:
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-svc.default.svc.cluster.local:9000
    region: us-east-1
    pathStyle: true
    secretRef: creds-storage-s3
