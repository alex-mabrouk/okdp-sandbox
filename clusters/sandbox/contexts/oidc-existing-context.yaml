# TEMPORARY: pins a Release back to static OIDC clients while its namespace runs
# in dcr mode. The upstream airflow package sends the platform scope verbatim at
# registration, openid included; openid is not a realm client scope, so Keycloak
# answers insufficient_scope and no credentials Secret is ever written. Drop this
# file, and the contexts block of the Releases referencing it, once the package
# strips openid from its registration request.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Context
metadata:
  name: oidc-existing
  namespace: okdp-system
spec:
  context:
    oidc:
      clientProvisioning: existing
