# Must exist before the Context below: releases would create it too late.
apiVersion: v1
kind: Namespace
metadata:
  name: okdp-system
---
# The platform Context, single source of platform truth: packages template
# against it, the Control Plane server reads it and manages serviceCatalog.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Context
metadata:
  name: platform
  namespace: okdp-system
spec:
  context:
    ingress:
      suffix: okdp.sandbox

    # The 5 URLs are maintained by hand (changing the realm or the suffix means changing all five).
    # In existing mode, the default client Secret name follows the creds-<release>-oauth2 convention.
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      authUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/auth
      tokenUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/token
      jwksUri: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/certs
      userinfoUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/userinfo
      displayName: keycloak
      scope: "openid profile email groups"
      usePKCE: true
      insecureSkipVerify: false
      clientProvisioning: existing

    proxy:
      httpProxy: ""
      httpsProxy: ""
      noProxy: ""

    certificateIssuers:
      selfSigned:
        name: default-issuer

    storageClass:
      data: standard
      workspace: standard

    serviceCatalog:
      defaultRepository: quay.io/okdp/platform-packages
      # Written by the console too: a re-apply resets the catalog to this seed.
      # Pre-Contract tags are not listed, the console no longer reads their marker.
      services:
        - name: hive-metastore
          versions: ["4.0.1-p02"]
          default: "4.0.1-p02"
          description: Hive metastore
          icon: pi-table
          category: Data-Catalog
        - name: superset
          versions: ["6.0.0-p02"]
          default: "6.0.0-p02"
          description: Superset
          category: Dataviz
        - name: trino
          versions: ["480.0.0-p19"]
          default: "480.0.0-p19"
          description: Trino
          category: Interactive-Query
        - name: polaris
          versions: ["1.3.0-incubating-p02"]
          default: "1.3.0-incubating-p02"
          description: Apache Polaris Iceberg catalog
          category: Data-Catalog
        - name: jupyterhub
          versions: ["4.3.3-p03"]
          default: "4.3.3-p03"
          description: JupyterHub
          category: Notebook
        - name: airflow
          versions: ["3.2.1-p03"]
          default: "3.2.1-p03"
          description: Apache Airflow
          category: Data-Engineering
        - name: spark-history-server
          versions: ["3.5.1-p05"]
          default: "3.5.1-p05"
          description: Spark History Server
          category: Spark
