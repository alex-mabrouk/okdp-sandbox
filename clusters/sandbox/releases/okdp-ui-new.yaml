# New OKDP console (roadmap: "Nouvelles versions okdp-server & okdp-ui"),
# deployed ALONGSIDE the current okdp-ui while the new console is validated.
# Same namespace as okdp-server-new: the console ingress routes /api to the
# server Service by name. Exposed at https://console.<ingress suffix>.
# The final switch will replace releases/okdp-ui.yaml with this package.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: okdp-ui-new
  namespace: kubocd-system
spec:
  createNamespace: false
  description: OKDP UI (new console) - Web interface for the Open Kubernetes Data Platform
  package:
    interval: 30m
    repository: ghcr.io/alex-mabrouk/okdp-packages/okdp-ui
    tag: 0.6.0-p01
    timeout: 10m
  targetNamespace: okdp-server-new
