# New control-plane server (roadmap: "Nouvelles versions okdp-server & okdp-ui"),
# deployed ALONGSIDE the current okdp-server while the new console is validated.
# Built from the alex-mabrouk fork — see the okdp-sandbox integration issue.
# The final switch will replace releases/okdp-server.yaml with this package.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: okdp-server-new
  namespace: kubocd-system
spec:
  createNamespace: true
  description: OKDP Server (new console) - API backend for the Open Kubernetes Data Platform
  package:
    interval: 30m
    repository: ghcr.io/alex-mabrouk/okdp-packages/okdp-server
    tag: 0.6.0-p01
    timeout: 10m
  targetNamespace: okdp-server-new
